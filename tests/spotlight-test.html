<head>
    
    <style>
        body {margin: 0;
              padding: 0;}
        .wrapper {height: 100vh;
                  background-image: url('https://cs4.pikabu.ru/post_img/big/2016/05/14/11/1463253214123152134.jpg');
                  background-size: cover;
                  position: relative;
                  overflow: hidden;}
        .shadow {position: absolute;
                 width: 200vw;
                 height: 200vh;
                 left: 50%;
                 top: 50%;
                 transform: translateX(-50%) translateY(-50%);
                 background-image: radial-gradient(circle at center, transparent, #000 20%);}
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.module.js" integrity="sha256-WK/EJImTrql5EQIEpr2ViDEulDC+Fay9S8aH/huq0IM=" crossorigin="anonymous"></script>
    <script>
        const shadow = document.querySelector('.shadow');
        document.addEventListener('mousemove', (e) => {
        let x = e.clientX - (document.documentElement.clientWidth * 1.5);
        let y = e.clientY - (document.documentElement.clientHeight * 1.5);
        shadow.style.transform = 'translate(' + x + 'px, ' + y + 'px)';})
    </script>
</head>
<body>
    <div class="wrapper">
        <div class="shadow"></div>
    </div>
</body>
